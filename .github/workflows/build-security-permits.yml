name: Build security permit PDFs

on:
  push:
    paths:
      - 'public/permits/**/source.html'
      - '.github/workflows/build-security-permits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render all security permits
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(p));
              else if (ent.isFile() && ent.name === 'source.html') out.push(p);
            }
            return out;
          }

          (async () => {
            const sources = walk('public/permits');
            if (!sources.length) {
              console.log('No permit sources found.');
              return;
            }

            const browser = await chromium.launch({ headless: true });
            for (const source of sources) {
              const page = await browser.newPage({
                viewport: { width: 1240, height: 900 },
                deviceScaleFactor: 1
              });

              const abs = path.resolve(source);
              await page.goto('file://' + abs, { waitUntil: 'networkidle', timeout: 120000 });

              await page.evaluate(() => {
                try {
                  document.querySelectorAll('input, textarea, select').forEach(el => el.blur());
                  if (typeof window.generateQR === 'function') window.generateQR();
                  if (typeof window.ipcGenerateQR === 'function') window.ipcGenerateQR();
                } catch (_) {}
              });

              await page.waitForTimeout(800);

              const out = path.join(path.dirname(source), 'permit.pdf');
              await page.pdf({
                path: out,
                preferCSSPageSize: true,
                printBackground: true,
                margin: { top: '0', right: '0', bottom: '0', left: '0' }
              });

              await page.close();
              console.log(`Rendered ${source} -> ${out}`);
            }

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/permits/**/permit.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "Build security permit PDFs"
          git push
